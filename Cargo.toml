[package]
name = "payment_engine"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "An asynchronous, PostgreSQL-backed payment ledger built with Actix Web and Tokio"
repository = "https://github.com/pythonfortinero/payment_engine"
keywords = ["payments", "ledger", "actix", "sqlx", "postgresql"]

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
prometheus = "0.14"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = "0.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
