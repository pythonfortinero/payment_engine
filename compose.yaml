services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_engine
      POSTGRES_USER: payment_engine
      POSTGRES_PASSWORD: payment_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_engine -d payment_engine"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://payment_engine:payment_engine@postgres:5432/payment_engine
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      RUST_LOG: info,payment_engine=debug,sqlx=warn
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    stop_grace_period: 35s

volumes:
  postgres_data:
